<style>
  :root {
    --bg: #faf5ef; --card: #fefbf6; --border: #8a8078; --accent: #f4845f;
    --cream: #faf0e6; --text: #5a534c; --muted: #a0907e; --light: #e8ddd0;
    --tan: #d4a574; --shadow: #d4c4b0;
    --weather: #6b9bd2; --place: #7bb86f; --time: #d4a03c; --mood: #c76b8a; --custom: #a08cc4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DotGothic16', monospace; font-size: 13px;
    min-height: 100vh; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: radial-gradient(circle, var(--light) 1px, transparent 1px);
    background-size: 16px 16px; opacity: .4; pointer-events: none; z-index: 0;
  }
  .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; }

  /* Header */
  .header {
    text-align: center; padding: 28px 16px 12px; border-bottom: 2px dashed var(--shadow);
    min-height: 156px; display: flex; flex-direction: column; align-items: center;
  }
  .header > div:first-child {
    height: 80px; flex: 0 0 80px; display: flex; align-items: center; justify-content: center;
  }
  .header h1 {
    height: 34px; line-height: 34px; font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: 6px;
    text-transform: uppercase; text-shadow: 2px 2px 0 #fce4d6; white-space: nowrap;
    display: flex; align-items: center; justify-content: center; gap: 2px; flex: 0 0 34px;
  }
  .phase-wave { color: var(--accent); filter: drop-shadow(2px 2px 0 #fce4d6); margin: 0 -1px; width: 20px; height: 10px; flex: 0 0 20px; display: block; }
  .gear {
    position: absolute; top: 16px; right: 16px; cursor: pointer; opacity: .6;
    transition: opacity .2s; text-align: center; font-size: 7px; font-weight: 600;
    color: var(--accent); letter-spacing: 2px;
  }
  .gear:hover { opacity: 1; }
  .gear span { display: block; margin-top: 2px; }

  /* Nav */
  .nav { display: flex; justify-content: center; gap: 12px; padding: 20px 16px; flex-wrap: wrap; align-items: center; }
  .btn {
    padding: 10px 20px; border: 2px solid var(--border); background: var(--cream);
    color: #7a7068; cursor: pointer; font-size: 12px; font-family: inherit;
    box-shadow: 2px 2px 0 var(--shadow); transition: all .15s; line-height: 1.4;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn.active { background: var(--accent); color: var(--cream); box-shadow: 3px 3px 0 #7a7068; }
  .btn.small { padding: 10px 14px; }

  /* Columns */
  .columns { display: flex; gap: 0; padding: 0 12px 24px; min-height: 60vh; }
  .col { flex: 1; padding: 0 8px; }
  .col-label { text-align: center; font-size: 13px; letter-spacing: 3px; color: var(--muted); padding: 8px 0 12px; }
  .divider { width: 2px; margin: 0 4px; flex-shrink: 0; background: repeating-linear-gradient(to bottom, var(--shadow) 0, var(--shadow) 4px, transparent 4px, transparent 8px); }

  /* Cards */
  .card {
    background: var(--card); border: 2px solid var(--border); margin-bottom: 12px;
    padding: 14px; cursor: pointer; box-shadow: 3px 3px 0 var(--light);
    transition: all .25s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 4px 4px 0 var(--shadow); }
  .card.expanded { box-shadow: 4px 4px 0 var(--tan); transform: none; }
  .card.pair-glow, .card-empty.pair-glow {
    box-shadow: 0 0 0 2px #f6c6ad, 0 0 16px #f6c6ad99, 3px 3px 0 var(--light);
  }
  .card-empty {
    background: transparent; border: 2px dashed var(--shadow); margin-bottom: 12px;
    padding: 32px 14px; text-align: center; color: #c4b4a0; font-size: 11px;
  }
  .cover {
    width: 100%; aspect-ratio: 1; border: 1px solid var(--light);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #fce4d6, #f4845f22 50%, var(--light));
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .vinyl { width: 60%; height: 60%; border-radius: 50%; background: radial-gradient(circle, #7a7068 15%, #6a635c 16%, #6a635c 30%, #7a7068 31%); opacity: .15; }
  .pair-pill {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    font-size: 10px; line-height: 1.1; color: var(--cream);
    background: #7a7068dd; border: 1px solid #5a534c;
    padding: 2px 8px; border-radius: 999px;
  }
  .cover .album-label { position: absolute; bottom: 6px; right: 6px; font-size: 8px; color: var(--muted); background: #faf0e6cc; padding: 2px 4px; }
  .song-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 2px; line-height: 1.3; }
  .song-artist { font-size: 11px; color: #8a7a68; margin-bottom: 4px; }
  .listen-link { font-size: 9px; color: var(--weather); text-decoration: none; }
  .tag { display: inline-block; padding: 3px 8px; font-size: 10px; margin: 0 4px 4px 0; }
  .pair-meta {
    margin-top: 6px; font-size: 10px; color: var(--muted);
    line-height: 1.4; word-break: break-word;
  }

  /* Expanded card content */
  .theme-bar { font-size: 10px; color: var(--muted); margin-top: 10px; padding: 8px; background: #f4f0ea; }
  .theme-title { font-size: 11px; color: var(--text); line-height: 1.5; word-break: break-word; }
  .pair-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:10px; padding:8px; background:#f4f0ea; }
  .pair-jump { border:none; background:none; color:var(--accent); cursor:pointer; font-size:14px; font-family:inherit; padding:0; line-height:1; }
  .pair-jump.disabled { opacity:.35; }
  .note { font-size: 12px; line-height: 1.6; color: #7a7068; padding: 10px 0; border-top: 1px dashed var(--light); margin-top: 8px; font-style: italic; }
  .comments-section { border-top: 2px dashed var(--light); margin-top: 12px; padding-top: 10px; }
  .comments-label { font-size: 10px; color: var(--muted); margin-bottom: 8px; letter-spacing: 1px; }
  .comment-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .comment-row.claude { flex-direction: row; }
  .comment-row.user { flex-direction: row-reverse; }
  .comment-avatar { width: 22px; height: 22px; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 2px solid var(--border); background: var(--cream); }
  .comment-bubble { padding: 8px 10px; font-size: 11px; line-height: 1.5; color: var(--text); max-width: 85%; }
  .comment-bubble.claude { background: #fce4d6; border: 1px solid #f4c4a0; }
  .comment-bubble.user { background: #e8ede4; border: 1px solid #c4d4b4; }
  .comment-input { display: flex; gap: 6px; margin-top: 8px; }
  .comment-input input { flex: 1; padding: 8px 10px; border: 2px solid var(--border); background: var(--cream); font-family: inherit; font-size: 11px; color: var(--text); outline: none; }
  .comment-input button { padding: 6px 12px; border: 2px solid var(--border); background: var(--accent); color: var(--cream); cursor: pointer; font-size: 11px; font-family: inherit; box-shadow: 2px 2px 0 #7a7068; line-height: 1.4; white-space: nowrap; }

  /* Filter */
  .filter-bar { padding: 8px 16px 4px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px dashed var(--light); }
  .filter-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .filter-tag { padding: 3px 8px; font-size: 12px; line-height: 1.4; white-space: nowrap; cursor: pointer; font-family: inherit; }
  .filter-search-wrap { position: relative; }
  .filter-search { width: 100%; padding: 6px 32px 6px 10px; border: 1px solid var(--light); background: var(--cream); font-family: inherit; font-size: 12px; color: var(--text); outline: none; box-sizing: border-box; }
  .filter-search-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1; padding: 0; font-family: inherit; }
  .filter-search-icon { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); display: flex; align-items: center; }
  .filter-suggest-panel { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 50; background: var(--card); border: 2px solid var(--border); padding: 8px; box-shadow: 4px 4px 0 var(--shadow); display: flex; flex-wrap: wrap; gap: 4px; box-sizing: border-box; }
  .filter-row-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .filter-selected-chip { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; font-size: 10px; border-radius: 99px; }
  .filter-chip-x { cursor: pointer; background: none; border: none; padding: 0 0 0 2px; font-size: 11px; line-height: 1; font-family: inherit; }
  .filter-more-btn { padding: 3px 8px; font-size: 10px; line-height: 1.4; white-space: nowrap; border: 1px solid var(--shadow); background: transparent; color: #8a7a68; cursor: pointer; font-family: inherit; }
  .filter-more-btn.open { background: var(--accent); border-color: var(--accent); color: var(--cream); }
  .filter-clear { padding: 3px 8px; font-size: 10px; line-height: 1.4; white-space: nowrap; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; font-family: inherit; }
  .filter-more-panel { padding: 8px 16px 4px; border-top: 1px dashed var(--light); }
  .filter-fav-add-btn { padding: 3px 8px; font-size: 12px; line-height: 1.4; white-space: nowrap; border: 1px solid var(--shadow); background: transparent; color: #8a7a68; cursor: pointer; font-family: inherit; }
  .filter-fav-picker { position: fixed; z-index: 200; left: 16px; right: 16px; top: 20vh; max-height: 55vh; background: var(--card); border: 2px solid var(--border); box-shadow: 4px 4px 0 var(--shadow); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; box-sizing: border-box; }
  .filter-fav-picker-header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--light); position: sticky; top: 0; background: var(--card); z-index: 1; }
  .filter-fav-picker-search { flex: 1; padding: 5px 10px; border: 1px solid var(--light); background: var(--cream); font-family: inherit; font-size: 11px; color: var(--text); outline: none; }
  .filter-fav-picker-close { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; padding: 0 2px; font-family: inherit; }
  .filter-fav-picker-group { padding: 8px 10px 4px; }
  .filter-fav-picker-group-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-bottom: 6px; }
  .filter-fav-picker-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .filter-more-search { width: 100%; padding: 5px 10px; border: 1px solid var(--light); background: var(--cream); font-family: inherit; font-size: 11px; color: var(--text); outline: none; margin-bottom: 8px; box-sizing: border-box; }

  .filter-group-label { font-size: 10px; letter-spacing: 1px; color: var(--muted); }
  .filter-group-row { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; }
  .filter-tag-panel { position: fixed; z-index: 150; min-width: 160px; max-width: calc(100vw - 16px); max-height: 50vh; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: var(--card); border: 2px solid var(--border); padding: 8px; box-shadow: 4px 4px 0 var(--shadow); display: flex; flex-wrap: wrap; gap: 4px; box-sizing: border-box; align-content: flex-start; }
  .filter-cat-btn { padding: 4px 10px; font-size: 12px; line-height: 1.4; white-space: nowrap; border: 1px solid var(--shadow); background: transparent; color: #8a7a68; cursor: pointer; font-family: inherit; }
  .filter-cat-btn.has-active { border-color: var(--accent); background: #fce4d6; color: var(--accent); }
  .filter-cat-btn.open { background: var(--accent); border-color: var(--accent); color: var(--cream); }

  /* Exchange */
  .exchange { max-width: 600px; margin: 0 auto; padding: 16px; }
  .exchange-card { background: var(--card); border: 2px solid var(--border); padding: 20px; margin-bottom: 16px; box-shadow: 3px 3px 0 var(--light); }
  .input { width: 100%; padding: 10px; border: 2px solid var(--border); background: var(--cream); font-family: inherit; font-size: 12px; color: var(--text); outline: none; margin-bottom: 8px; }
  .input:focus { border-color: var(--accent); }
  textarea.input { resize: vertical; min-height: 60px; }
  .submit-btn { padding: 10px 24px; border: 2px solid var(--border); background: var(--accent); color: var(--cream); cursor: pointer; font-size: 12px; font-family: inherit; box-shadow: 3px 3px 0 #7a7068; line-height: 1.4; }
  .submit-btn:disabled { opacity: .5; cursor: not-allowed; }
  .submit-btn:not(:disabled):hover { transform: translateY(-1px); }

  /* History card */
  .hist-card { padding: 12px; background: var(--card); border: 2px solid var(--light); margin-bottom: 8px; cursor: pointer; transition: all .2s; }
  .hist-card:hover { border-color: var(--accent); box-shadow: 3px 3px 0 #fce4d6; }
  .hist-meta { font-size: 10px; color: var(--muted); margin-bottom: 8px; text-align: center; }
  .hist-theme { font-size: 11px; color: #7a7068; margin-bottom: 10px; font-style: italic; text-align: center; }
  .hist-songs { display: flex; align-items: center; gap: 8px; }
  .hist-side { flex: 1; display: flex; align-items: center; gap: 6px; }
