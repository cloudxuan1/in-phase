name: One-time bookmark icon patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'one-time bookmark icon patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync bookmark favicon with touch icon
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'index.html';
          let html = fs.readFileSync(file, 'utf8');
          const oldBlock = `    let link = document.querySelector('link[rel="apple-touch-icon"]');
    if (!link) { link = document.createElement("link"); link.rel = "apple-touch-icon"; document.head.appendChild(link); }
    link.href = canvas.toDataURL("image/png");`;
          const newBlock = `    const iconData = canvas.toDataURL("image/png");
    let link = document.querySelector('link[rel="apple-touch-icon"]');
    if (!link) { link = document.createElement("link"); link.rel = "apple-touch-icon"; document.head.appendChild(link); }
    link.href = iconData;
    let favicon = document.querySelector('link[rel="icon"]') || document.querySelector('link[rel="shortcut icon"]');
    if (!favicon) { favicon = document.createElement("link"); favicon.rel = "icon"; document.head.appendChild(favicon); }
    favicon.type = "image/png";
    favicon.href = iconData;`;
          if (!html.includes(oldBlock)) {
            throw new Error('Target apple-touch-icon block not found');
          }
          html = html.replace(oldBlock, newBlock);
          fs.writeFileSync(file, html);
          fs.unlinkSync('.github/workflows/one-time-bookmark-icons.yml');
          NODE
      - name: Commit patch
        run: |
          git config user.name "codex-app[bot]"
          git config user.email "codex-app[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-bookmark-icons.yml
          git commit -m "fix: sync bookmark favicon with touch icons"
          git push

# trigger: bookmark icons
